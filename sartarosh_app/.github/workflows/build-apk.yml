name: Build APK & Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Get version from pubspec
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Write update manifest (app checks this only after release is published)
        run: |
          printf '%s\n' "{\"version\":\"${{ steps.version.outputs.version }}\"}" > update_manifest.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Sartarosh v${{ steps.version.outputs.version }}
          body: |
            ## Sartarosh v${{ steps.version.outputs.version }}
            
            Yangi versiya tayyor!
            
            ### O'zgarishlar:
            - Sartarosh va Mijoz rollari to'liq ajratildi (Pro dizayn)
            - Sartaroshlar uchun "Sartarosh paneli" avtomatik ochilishi to'g'irlandi
            - Ilova tezligi oshirildi va koddagi ortiqcha mantiqlar olib tashlandi
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            update_manifest.json
          draft: false
          prerelease: false
